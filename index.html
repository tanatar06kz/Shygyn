<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Қаржы Бақылау</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f7;
      color: #000;
      margin: 0;
      padding: 16px;
      padding-bottom: 40px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title { font-size: 24px; font-weight: 700; }
    .btn-reset {
      background: #e5e5ea;
      color: #ff3b30;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .total-title { font-size: 14px; color: #8e8e93; margin-bottom: 4px; }
    .total-amount { font-size: 32px; font-weight: 800; color: #007aff; }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 10px 0;
    }
    .section-title { font-size: 18px; font-weight: 600; }
    .btn-add {
      background: #e5e5ea;
      color: #007aff;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .item-card {
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      position: relative;
    }
    .item-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .item-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      color: #fff;
      flex-shrink: 0;
    }
    .item-info { flex: 1; overflow: hidden; }
    .item-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-price { font-size: 12px; color: #8e8e93; margin-top: 2px; }
    .edit-btn {
      border: none;
      background: #f2f2f7;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: #fff;
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.25s ease-out;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-overlay.active .modal {
      transform: translateY(0);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 16px 0;
    }
    .qty-btn {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      border: none;
      background: #e5e5ea;
      font-size: 24px;
      font-weight: 600;
      color: #007aff;
      cursor: pointer;
    }
    .qty-num { font-size: 26px; font-weight: 700; width: 40px; text-align: center; }
    .modal-action-btn {
      width: 100%;
      background: #34c759;
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .input-group {
      margin-bottom: 14px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 4px;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e5ea;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #f9f9f9;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">Қаржы Бақылау</div>
    <button class="btn-reset" onclick="resetTodayTotal()">Бүгінді нөлдеу</button>
  </div>

  <div class="card">
    <div class="total-title">Бүгінгі шығын</div>
    <div class="total-amount" id="todayTotal">0 ₸</div>
  </div>

  <div class="section-header">
    <div class="section-title">Заттар тізімі</div>
    <button class="btn-add" onclick="openAddModal()">+ Жаңа зат</button>
  </div>

  <div class="grid" id="itemsGrid"></div>

  <!-- Quantity & Price Modal -->
  <div class="modal-overlay" id="qtyModal">
    <div class="modal">
      <div class="modal-header">
        <div id="modalItemTitle" style="font-size: 18px; font-weight: 700;">Зат аты</div>
        <button style="border:none; background:none; font-size:20px; color:#8e8e93;" onclick="closeQtyModal()">✕</button>
      </div>

      <div class="input-group">
        <label>1 дананың бағасы (өз қалаңдағы бағаны жаз, ₸)</label>
        <input type="number" id="modalPriceInput" oninput="onModalPriceChange()">
      </div>

      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty(-1)">–</button>
        <div class="qty-num" id="qtyVal">1</div>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>

      <div style="display:flex; justify-content:space-between; margin-bottom: 14px; padding: 12px; background: #f2f2f7; border-radius: 10px;">
        <span>Жалпы сомасы:</span>
        <span id="modalTotalPrice" style="font-weight:700; color:#ff3b30;">0 ₸</span>
      </div>

      <button class="modal-action-btn" onclick="confirmAddExpense()">✓ Есепке қосу</button>
    </div>
  </div>

  <!-- Add / Edit Item Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-header">
        <div id="addModalTitle" style="font-size: 18px; font-weight: 700;">Жаңа батырма қосу</div>
        <button style="border:none; background:none; font-size:20px; color:#8e8e93;" onclick="closeAddModal()">✕</button>
      </div>

      <div class="input-group">
        <label>Атауы (Заттың аты)</label>
        <input type="text" id="newItemName" placeholder="Мысалы: Gorilla, Су">
      </div>

      <div class="input-group">
        <label>Бағасы (Теңгемен ₸)</label>
        <input type="number" id="newItemPrice" placeholder="Мысалы: 700">
      </div>

      <div class="input-group">
        <label>Категориясы</label>
        <select id="newItemCategory">
          <option value="Әдеттер & Күнделікті">Әдеттер & Күнделікті</option>
          <option value="Азық-түлік & Дүкен">Азық-түлік & Дүкен</option>
          <option value="Көлік & Жанармай">Көлік & Жанармай</option>
          <option value="Міндетті төлемдер">Міндетті төлемдер</option>
        </select>
      </div>

      <button class="modal-action-btn" style="background:#007aff;" onclick="saveNewItem()">Сақтау</button>
    </div>
  </div>

  <script>
    let defaultItems = [
      { id: 1, name: 'Gorilla', price: 650, icon: '⚡', bg: '#ff9500', cat: 'Әдеттер & Күнделікті' },
      { id: 2, name: 'Темекі', price: 1280, icon: '🚬', bg: '#ff3b30', cat: 'Әдеттер & Күнделікті' },
      { id: 3, name: 'Кола 2L', price: 900, icon: '🥤', bg: '#ff2d55', cat: 'Азық-түлік & Дүкен' },
      { id: 4, name: 'Нан 2 шт', price: 320, icon: '🍞', bg: '#ffcc00', cat: 'Азық-түлік & Дүкен' },
      { id: 5, name: 'Жанармай', price: 2500, icon: '⛽', bg: '#007aff', cat: 'Көлік & Жанармай' },
      { id: 6, name: 'Су 1.5L', price: 250, icon: '💧', bg: '#5ac8fa', cat: 'Азық-түлік & Дүкен' }
    ];

    let items = JSON.parse(localStorage.getItem('app_items')) || defaultItems;
    let todayTotal = parseInt(localStorage.getItem('today_total')) || 0;
    let selectedItem = null;
    let editingItemId = null;
    let currentQty = 1;
    let activeUnitPrice = 0;

    function saveItemsToStorage() {
      localStorage.setItem('app_items', JSON.stringify(items));
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      items.forEach(item => {
        grid.innerHTML += `
          <div class="item-card">
            <div class="item-main" onclick="openQtyModal(${item.id})">
              <div class="item-icon" style="background:${item.bg}">${item.icon}</div>
              <div class="item-info">
                <div class="item-name">${item.name}</div>
                <div class="item-price">${Number(item.price).toLocaleString()} ₸</div>
              </div>
            </div>
            <button class="edit-btn" title="Өзгерту" onclick="openEditModal(${item.id})">✏️</button>
          </div>
        `;
      });
      document.getElementById('todayTotal').innerText = Number(todayTotal).toLocaleString() + ' ₸';
    }

    function openQtyModal(id) {
      selectedItem = items.find(i => i.id === id);
      currentQty = 1;
      activeUnitPrice = Number(selectedItem.price) || 0;
      document.getElementById('modalItemTitle').innerText = selectedItem.name;
      document.getElementById('modalPriceInput').value = activeUnitPrice;
      updateQtyDisplay();
      document.getElementById('qtyModal').classList.add('active');
    }

    function closeQtyModal() {
      document.getElementById('qtyModal').classList.remove('active');
    }

    function onModalPriceChange() {
      const val = parseFloat(document.getElementById('modalPriceInput').value);
      activeUnitPrice = isNaN(val) || val < 0 ? 0 : val;
      updateQtyDisplay();
    }

    function changeQty(delta) {
      if (currentQty + delta >= 1) {
        currentQty += delta;
        updateQtyDisplay();
      }
    }

    function updateQtyDisplay() {
      document.getElementById('qtyVal').innerText = currentQty;
      const total = activeUnitPrice * currentQty;
      document.getElementById('modalTotalPrice').innerText = Number(total).toLocaleString() + ' ₸';
    }

    function confirmAddExpense() {
      if (selectedItem && activeUnitPrice !== selectedItem.price) {
        selectedItem.price = activeUnitPrice;
        saveItemsToStorage();
      }
      const total = activeUnitPrice * currentQty;
      todayTotal += total;
      localStorage.setItem('today_total', todayTotal);
      renderItems();
      closeQtyModal();
    }

    function resetTodayTotal() {
      todayTotal = 0;
      localStorage.setItem('today_total', 0);
      renderItems();
    }

    function openAddModal() {
      editingItemId = null;
      document.getElementById('addModalTitle').innerText = 'Жаңа батырма қосу';
      document.getElementById('newItemName').value = '';
      document.getElementById('newItemPrice').value = '';
      document.getElementById('addModal').classList.add('active');
    }

    function openEditModal(id) {
      const target = items.find(i => i.id === id);
      if (!target) return;
      editingItemId = id;
      document.getElementById('addModalTitle').innerText = 'Затты өзгерту';
      document.getElementById('newItemName').value = target.name;
      document.getElementById('newItemPrice').value = target.price;
      document.getElementById('newItemCategory').value = target.cat || 'Азық-түлік & Дүкен';
      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      editingItemId = null;
    }

    function saveNewItem() {
      const name = document.getElementById('newItemName').value.trim();
      const price = parseFloat(document.getElementById('newItemPrice').value);
      const cat = document.getElementById('newItemCategory').value;

      if (!name || isNaN(price) || price < 0) {
        alert('Заттың аты мен бағасын дұрыс енгізіңіз!');
        return;
      }

      if (editingItemId !== null) {
        const idx = items.findIndex(i => i.id === editingItemId);
        if (idx !== -1) {
          items[idx].name = name;
          items[idx].price = price;
          items[idx].cat = cat;
        }
      } else {
        items.push({
          id: Date.now(),
          name: name,
          price: price,
          icon: '🛒',
          bg: '#5856d6',
          cat: cat
        });
      }

      saveItemsToStorage();
      renderItems();
      closeAddModal();
    }

    renderItems();
  </script>
</body>
</html>
